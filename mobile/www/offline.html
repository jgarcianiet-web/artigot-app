<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sin conexión</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fafaf9; color: #1c1917; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 20px; }
    p { color: #57534e; }
    button { margin-top: 12px; background: #5b3fd6; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Sin conexión</h1>
    <p>No se puede conectar con Artigot. Comprueba tu conexión a internet.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Reintentar</button>
  </main>
</body>
</html>
